name: umi_0524_gopro

task_name: ${name}

shape_meta: &shape_meta
  obs:
    main_img:
      shape: [3, 224, 224]
      type: rgb
      horizon: ${n_obs_steps}
    agent_pos:
      shape: [7]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [7]
    horizon: ${n_action_steps}

env_runner: null

dataset:
  _target_: diffusion_policies.dataset.umi_image_dataset.UMIImageDataset
  shape_meta: ${shape_meta}
  zarr_path: /nvme1/xinhai/projects/UMI-Gen/data/zarr/dataset_0524_vive_rsrgb_input/dp_gopro.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: ${training.seed}
  val_ratio: 0.02
  max_train_episodes: null
